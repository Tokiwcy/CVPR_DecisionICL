seed: 20260825
manifest: ../data/spawrious_o2o_easy/manifest.jsonl
output_dir: ../artifacts/spawrious_o2o_easy_weighted
labels:
  - bulldog
  - dachshund
  - labrador
  - corgi
prompt_shots: 3
selection_method_name: weighted_counter_spurious_global_3shot
diagnostic:
  kind: manifest_boolean
  metadata_key: diagnostic
  definition: dog breed appears in the shared filler location rather than its aligned location
lambda_selection_objective: group_robustness
max_aligned_accuracy_drop: 1.0
target_model:
  kind: qwen3_vl
  model: ../models/Qwen3-VL-4B-Instruct
  quantization: none
  dtype: bfloat16
  device_map: auto
  attn_implementation: sdpa
  local_files_only: true
  classification_batch_size: 4
  icl_batch_size: 2
  min_pixels: 65536
  max_pixels: 401408
  efficient_next_logits: true
  max_new_tokens: 32
  task_instruction: Identify the dog breed shown in the image.
similarity_model:
  kind: siglip2
  model: ../models/siglip2-base-patch16-224
  dtype: float16
  device: cuda
  batch_size: 48
  local_files_only: true
diagnostic_subject_guidance: Prefer cues on the dog's head, muzzle, ears, coat, body proportions, legs, and build.
